# Drops into /etc/nginx/conf.d/ — nginx includes it in http{} context.
# Adds $host as the first field so goaccess can group by virtual host.

log_format vcombined '$host $remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

# Same fields, but logging $uri instead of $request so the query string is left
# out. Used for routes whose URLs can carry a credential — a token in a log file
# is a leaked token, and these logs also feed the goaccess dashboard.
log_format vcombined_noquery '$host $remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
