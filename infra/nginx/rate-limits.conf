# Drops into /etc/nginx/conf.d/ — nginx includes it in the http{} context.
# Keeps limit_req_zone definitions separate so per-site configs can just
# reference the zones.

limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
limit_req_zone  $binary_remote_addr zone=upload:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Return 429 instead of default 503 so clients can tell it's rate-limiting.
limit_req_status  429;
limit_conn_status 429;
