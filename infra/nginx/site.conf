map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen YOUR.VPS.IP.ADDR:443 ssl http2;
  server_name your-site.example.com;
  client_max_body_size 20M;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!MEDIUM:!LOW:!aNULL:!NULL:!SHA;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_certificate     /etc/letsencrypt/live/your-site.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-site.example.com/privkey.pem;

  # Frontend static files
  root /var/www/butter-notebooks;
  index index.html;

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # API proxy → Mac mini via Tailscale
  location /v1/ {
    limit_req  zone=api burst=30 nodelay;
    limit_conn conn 20;

    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Tighter cap on uploads — photos are big and scanners love POST /upload.
  location = /v1/upload {
    limit_req  zone=upload burst=5 nodelay;
    limit_conn conn 5;

    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/v1/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /health {
    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /wedding {
    alias /var/www/wedding/;
  }
}

server {
  listen YOUR.VPS.IP.ADDR:80;
  server_name your-site.example.com;
  client_max_body_size 20M;
  return 301 https://$host$request_uri;
}
