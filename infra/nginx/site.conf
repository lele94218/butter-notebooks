map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen YOUR.VPS.IP.ADDR:443 ssl http2;
  server_name your-site.example.com;
  client_max_body_size 20M;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!MEDIUM:!LOW:!aNULL:!NULL:!SHA;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_certificate     /etc/letsencrypt/live/your-site.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-site.example.com/privkey.pem;

  access_log /var/log/nginx/access.log vcombined;

  # Frontend static files
  root /var/www/butter-notebooks;
  index index.html;

  # PWA manifest needs its own MIME type (iOS is picky about octet-stream)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Service worker must never be cached, or updates can't roll out
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hashed build assets are immutable — cache them hard
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # API proxy → Mac mini via Tailscale
  location /v1/ {
    # Single-user service, but a phone + laptop + several tabs each hold SSE
    # connections open, which used to exhaust the 20-slot pool and make new
    # requests fail with 429 ("limiting connections by zone").
    limit_req  zone=api burst=60 nodelay;
    limit_conn conn 100;

    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Tighter cap on uploads — photos are big and scanners love POST /upload.
  location = /v1/upload {
    limit_req  zone=upload burst=20 nodelay;
    limit_conn conn 30;

    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/v1/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Jupyter notebook reverse proxy → Mac mini :8888
  location /jupyter/ {
    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8888/jupyter/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
  }

  location /health {
    proxy_pass http://YOUR.MAC.TAILSCALE.IP:8765/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /wedding {
    alias /var/www/wedding/;
  }

  # goaccess stats dashboard (regenerated every 5 min by /usr/local/bin/goaccess-update.sh)
  location /_stats/ {
    auth_basic           "butter-notebooks stats";
    auth_basic_user_file /etc/nginx/auth/butter-stats.htpasswd;
    alias                /var/www/butter-notebooks/_stats/;
    index                index.html;
    try_files            $uri $uri/ =404;
  }
}

server {
  listen YOUR.VPS.IP.ADDR:80;
  server_name your-site.example.com;
  client_max_body_size 20M;
  return 301 https://$host$request_uri;
}
