# Tombstone for the decommissioned Mastodon instance on your-other-site.example.com.
# Returns 410 Gone so fediverse peers stop retrying deliveries to /inbox.
# Mastodon federation respects 410 as "permanently gone" — peers will
# remove this host from their delivery queues within days instead of
# retrying for months on 502/timeout.

server {
  listen YOUR.VPS.IP.ADDR:80;
  server_name your-other-site.example.com;
  access_log /var/log/nginx/access.log vcombined;
  return 410;
}

server {
  listen YOUR.VPS.IP.ADDR:443 ssl http2;
  server_name your-other-site.example.com;

  ssl_certificate     /etc/letsencrypt/live/your-other-site.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your-other-site.example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!MEDIUM:!LOW:!aNULL:!NULL:!SHA;

  access_log /var/log/nginx/access.log vcombined;
  return 410;
}
