<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, minimum-scale=1, maximum-scale=1" />
    <!-- iOS home-screen app: needs a PNG icon (SVG is ignored) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="butter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the app below the status bar. black-translucent makes
         content slide under the clock/battery — don't use it here. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>butter notebooks</title>
    <link rel="preconnect" href="https://assets-proxy.anthropic.com" crossorigin />
    <meta name="theme-color" content="#2f2e2b" />
    <script>
      (function(){
        var t=localStorage.getItem('butter_theme')||'dark';
        var c={dark:'#2f2e2b',light:'#f5f3ee'};
        document.querySelector('meta[name="theme-color"]').content=c[t]||c.dark;
        document.documentElement.dataset.theme=t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
